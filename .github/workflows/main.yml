name: ASP.NET WebForms CI/CD

on:
  push:
    branches:
      - master
      - main

env:
  SOLUTION: DemoWebAndValidationControl.sln
  CONFIGURATION: Release

  WEBSITE_NAME: DemoWebAndValidationControl
  WEBSITE_PATH: C:\MyWebApp

############################################################
# Stage 1
############################################################

jobs:

  Build:

    name: Stage 1 - Build & Publish

    runs-on: windows-latest

    steps:

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore "${{ env.SOLUTION }}"

    - name: Build and Publish Website
      shell: powershell
      run: |

        msbuild "${{ env.SOLUTION }}" `
          /p:Configuration=${{ env.CONFIGURATION }} `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=FileSystem `
          /p:DeleteExistingFiles=true `
          /p:publishUrl="${{ github.workspace }}\Published"

    - name: Display Published Files
      shell: powershell
      run: |

        Write-Host "Published Website"

        Get-ChildItem `
            "${{ github.workspace }}\Published" `
            -Recurse

    - name: Upload Website Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Website
        path: Published

############################################################
# Stage 2
############################################################

  Artifact:

    name: Stage 2 - Verify Artifact

    runs-on: windows-latest

    needs: Build

    steps:

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: Website
        path: Website

    - name: Verify Artifact
      shell: powershell
      run: |

        Write-Host "Artifact Downloaded Successfully"

        Get-ChildItem Website -Recurse

############################################################
# Stage 3
############################################################

  Deploy:

    name: Stage 3 - Deploy to IIS

    runs-on: self-hosted

    needs: Artifact

    steps:

    - name: Download Website Artifact
      uses: actions/download-artifact@v4
      with:
        name: Website
        path: Website

    - name: Stop IIS Website
      shell: powershell
      run: |

        Import-Module WebAdministration

        if(Get-Website -Name "${env:WEBSITE_NAME}" -ErrorAction SilentlyContinue)
        {
            Stop-WebSite -Name "${env:WEBSITE_NAME}"

            Write-Host "Website Stopped"
        }

    - name: Clean Existing Website
      shell: powershell
      run: |

        if(Test-Path "${env:WEBSITE_PATH}")
        {
            Remove-Item `
                "${env:WEBSITE_PATH}\*" `
                -Recurse `
                -Force
        }
        else
        {
            New-Item `
                -ItemType Directory `
                -Path "${env:WEBSITE_PATH}"
        }

    - name: Copy Website Files
      shell: powershell
      run: |

        robocopy `
            Website `
            "${env:WEBSITE_PATH}" `
            /MIR

        if ($LASTEXITCODE -ge 8)
        {
            exit $LASTEXITCODE
        }

    - name: Start IIS Website
      shell: powershell
      run: |

        Import-Module WebAdministration

        Start-WebSite -Name "${env:WEBSITE_NAME}"

        Write-Host "Website Started"

############################################################
# Stage 4
############################################################

  SmokeTest:

    name: Stage 4 - Smoke Test

    runs-on: self-hosted

    needs: Deploy

    steps:

    - name: Verify Deployment
      shell: powershell
      run: |

        if(Test-Path "${env:WEBSITE_PATH}\Web.config")
        {
            Write-Host "✓ Web.config Found"
        }
        else
        {
            throw "Deployment Failed"
        }

    - name: Test Website
      shell: powershell
      run: |

        try
        {
            $response = Invoke-WebRequest `
                -Uri "http://localhost" `
                -UseBasicParsing `
                -TimeoutSec 30

            Write-Host "Status Code :" $response.StatusCode

            if($response.StatusCode -eq 200)
            {
                Write-Host "✓ Website is Running Successfully"
            }
            else
            {
                throw "Website returned unexpected status code."
            }
        }
        catch
        {
            throw "Website is not accessible."
        }
