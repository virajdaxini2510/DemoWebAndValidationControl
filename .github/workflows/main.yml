name: ASP.NET WebForms CI/CD

on:
  push:
    branches:
      - master
      - main

env:
  SOLUTION_FILE: DemoWebAndValidationControl.sln
  BUILD_CONFIGURATION: Release
  WEBSITE_NAME: DemoWebAndValidationControl
  IIS_PATH: C:\inetpub\wwwroot\DemoWebAndValidationControl

jobs:

# =====================================================
# Stage 1 : Checkout
# =====================================================

  checkout:
    name: Stage 1 - Checkout Source
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

# =====================================================
# Stage 2 : Restore & Build
# =====================================================

  build:

    name: Stage 2 - Restore & Build

    runs-on: windows-latest

    needs: checkout

    steps:

      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore ${{ env.SOLUTION_FILE }}

      - name: Build Solution
        run: |
          msbuild ${{ env.SOLUTION_FILE }} ^
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} ^
          /p:DeployOnBuild=true ^
          /p:WebPublishMethod=Package ^
          /p:PackageAsSingleFile=true ^
          /p:SkipInvalidConfigurations=true ^
          /p:PackageLocation="${{ github.workspace }}\Published"

      - name: Verify Build Output
        run: dir Published

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebApplication
          path: Published

# =====================================================
# Stage 3 : Publish Artifact
# =====================================================

  publish:

    name: Stage 3 - Publish Artifact

    runs-on: windows-latest

    needs: build

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebApplication
          path: Artifact

      - name: Verify Artifact
        run: dir Artifact

# =====================================================
# Stage 4 : Deploy to IIS
# =====================================================

  deploy:

    name: Stage 4 - Deploy to IIS

    needs: publish

    runs-on: self-hosted

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebApplication
          path: Deploy

      - name: Stop IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebSite -Name "${{ env.WEBSITE_NAME }}"

      - name: Clean Existing Website
        shell: powershell
        run: |
          if(Test-Path "${{ env.IIS_PATH }}")
          {
              Remove-Item "${{ env.IIS_PATH }}\*" -Recurse -Force
          }

      - name: Extract Package
        shell: powershell
        run: |
          $zip = Get-ChildItem Deploy -Filter *.zip -Recurse | Select-Object -First 1
          Expand-Archive $zip.FullName "${{ env.IIS_PATH }}" -Force

      - name: Start IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebSite -Name "${{ env.WEBSITE_NAME }}"

      - name: Deployment Complete
        run: echo "Deployment Successful"
