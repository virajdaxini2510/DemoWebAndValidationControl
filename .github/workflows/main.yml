name: ASP.NET WebForms CI/CD

on:
  push:
    branches:
      - master
      - main

env:
  SOLUTION: DemoWebAndValidationControl.sln
  CONFIGURATION: Release

  WEBSITE_NAME: DemoWebAndValidationControl
  WEBSITE_PATH: C:\MyWebApp

############################################################
# Stage 1 : Build & Publish
############################################################

jobs:

  Build:

    name: Stage 1 - Build & Publish

    runs-on: windows-latest

    steps:

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore ${{ env.SOLUTION }}

    - name: Build Solution
      shell: powershell
      run: |
        msbuild "${{ env.SOLUTION }}" `
          /p:Configuration=${{ env.CONFIGURATION }}

    - name: Verify Build Output
      shell: powershell
      run: |
        if (!(Test-Path "bin")) {
          throw "Build failed. bin folder not found."
        }

        Write-Host "===== BUILD OUTPUT ====="
        Get-ChildItem bin

    - name: Create Deployment Folder
      shell: powershell
      run: |

        $publish = "${{ github.workspace }}\Published"

        if(Test-Path $publish)
        {
            Remove-Item $publish -Recurse -Force
        }

        New-Item -ItemType Directory -Path $publish | Out-Null

    - name: Copy Website Files
      shell: powershell
      run: |

        $publish="${{ github.workspace }}\Published"

        # Copy all root files
        Get-ChildItem -File | Copy-Item -Destination $publish -Force

        # Copy common ASP.NET folders if they exist
        $folders=@(
            "bin",
            "App_Data",
            "App_Themes",
            "Scripts",
            "Content",
            "Images",
            "Image",
            "Css",
            "css",
            "Js",
            "js",
            "fonts",
            "Fonts",
            "Uploads"
        )

        foreach($folder in $folders)
        {
            if(Test-Path $folder)
            {
                Copy-Item $folder $publish -Recurse -Force
            }
        }

    - name: Display Published Files
      shell: powershell
      run: |
        Write-Host "===== PUBLISHED WEBSITE ====="
        Get-ChildItem Published -Recurse

    - name: Upload Website Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Website
        path: Published
        if-no-files-found: error

############################################################
# Stage 2 : Verify & Download Artifact
############################################################

  Verify:

    name: Stage 2 - Verify & Download Artifact

    needs: Build

    runs-on: windows-latest

    steps:

    - name: Download Website Artifact
      uses: actions/download-artifact@v4
      with:
        name: Website
        path: Website

    - name: Verify Artifact
      shell: powershell
      run: |

        if (!(Test-Path "Website"))
        {
            throw "Artifact download failed."
        }

        Write-Host "===== ARTIFACT CONTENT ====="

        Get-ChildItem Website -Recurse

############################################################
# Stage 3 : Deploy to IIS
############################################################

  Deploy:

    name: Stage 3 - Deploy to IIS

    needs: Verify

    runs-on: self-hosted

    steps:

    - name: Download Website Artifact
      uses: actions/download-artifact@v4
      with:
        name: Website
        path: Website

    - name: Stop IIS Website
      shell: powershell
      run: |

        Import-Module WebAdministration

        if(Get-Website -Name "${env:WEBSITE_NAME}" -ErrorAction SilentlyContinue)
        {
            Stop-WebSite -Name "${env:WEBSITE_NAME}"
            Write-Host "Website stopped."
        }

    - name: Clean IIS Folder
      shell: powershell
      run: |

        if(Test-Path "${env:WEBSITE_PATH}")
        {
            Remove-Item "${env:WEBSITE_PATH}\*" -Recurse -Force
        }
        else
        {
            New-Item -ItemType Directory -Path "${env:WEBSITE_PATH}" | Out-Null
        }

    - name: Copy Website Files
      shell: powershell
      run: |

        robocopy Website "${env:WEBSITE_PATH}" /MIR

        if($LASTEXITCODE -ge 8)
        {
            exit $LASTEXITCODE
        }

    - name: Start IIS Website
      shell: powershell
      run: |

        Import-Module WebAdministration

        Start-WebSite -Name "${env:WEBSITE_NAME}"

        Write-Host "Website started."

############################################################
# Stage 4 : Smoke Test
############################################################

  SmokeTest:

    name: Stage 4 - Smoke Test

    needs: Deploy

    runs-on: self-hosted

    steps:

    - name: Verify Deployment Files
      shell: powershell
      run: |

        if(Test-Path "${env:WEBSITE_PATH}\Web.config")
        {
            Write-Host "✓ Web.config found."
        }
        else
        {
            throw "Deployment failed. Web.config not found."
        }

    - name: Test Website
      shell: powershell
      run: |

        try
        {
            $response = Invoke-WebRequest `
                -Uri "http://localhost" `
                -UseBasicParsing `
                -TimeoutSec 30

            Write-Host "HTTP Status Code: $($response.StatusCode)"

            if($response.StatusCode -eq 200)
            {
                Write-Host "✓ Website is running successfully."
            }
            else
            {
                throw "Unexpected HTTP status code: $($response.StatusCode)"
            }
        }
        catch
        {
            throw "Website is not accessible. Check IIS bindings and WEBSITE_NAME."
        }
