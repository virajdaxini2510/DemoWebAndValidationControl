name: ASP.NET WebForms CI/CD

on:
  push:
    branches:
      - master
      - main

env:
  SOLUTION: DemoWebAndValidationControl.sln
  CONFIGURATION: Release

  WEBSITE_NAME: DemoWebAndValidationControl
  WEBSITE_PATH: C:\MyWebApp

############################################################
# Stage 1 : Build & Publish
############################################################

jobs:

  Build:

    name: Stage 1 - Build & Publish

    runs-on: windows-latest

    steps:

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore ${{ env.SOLUTION }}

    - name: Build Solution
      shell: powershell
      run: |
        msbuild "${{ env.SOLUTION }}" `
          /p:Configuration=${{ env.CONFIGURATION }}

    - name: Verify Build Output
      shell: powershell
      run: |
        if (!(Test-Path "bin")) {
          throw "Build failed. bin folder not found."
        }

        Write-Host "===== BUILD OUTPUT ====="
        Get-ChildItem bin

    - name: Create Deployment Folder
      shell: powershell
      run: |

        $publish = "${{ github.workspace }}\Published"

        if(Test-Path $publish)
        {
            Remove-Item $publish -Recurse -Force
        }

        New-Item -ItemType Directory -Path $publish | Out-Null

    - name: Copy Website Files
      shell: powershell
      run: |

        $publish="${{ github.workspace }}\Published"

        # Copy all root files
        Get-ChildItem -File | Copy-Item -Destination $publish -Force

        # Copy common ASP.NET folders if they exist
        $folders=@(
            "bin",
            "App_Data",
            "App_Themes",
            "Scripts",
            "Content",
            "Images",
            "Image",
            "Css",
            "css",
            "Js",
            "js",
            "fonts",
            "Fonts",
            "Uploads"
        )

        foreach($folder in $folders)
        {
            if(Test-Path $folder)
            {
                Copy-Item $folder $publish -Recurse -Force
            }
        }

    - name: Display Published Files
      shell: powershell
      run: |
        Write-Host "===== PUBLISHED WEBSITE ====="
        Get-ChildItem Published -Recurse

    - name: Upload Website Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Website
        path: Published
        if-no-files-found: error

############################################################
# Stage 2 : Verify & Download Artifact
############################################################

  Verify:

    name: Stage 2 - Verify & Download Artifact

    needs: Build

    runs-on: windows-latest

    steps:

    - name: Download Website Artifact
      uses: actions/download-artifact@v4
      with:
        name: Website
        path: Website

    - name: Verify Artifact
      shell: powershell
      run: |

        if (!(Test-Path "Website"))
        {
            throw "Artifact download failed."
        }

        Write-Host "===== ARTIFACT CONTENT ====="

        Get-ChildItem Website -Recurse
############################################################
# Stage 3 : Deploy to IIS
############################################################

  Deploy:

    name: Stage 3 - Deploy to IIS

    needs: Verify

    runs-on: self-hosted

    steps:

    #-------------------------------------------------------
    # Download Artifact
    #-------------------------------------------------------

    - name: Download Website Artifact
      uses: actions/download-artifact@v4
      with:
        name: Website
        path: Website

    #-------------------------------------------------------
    # Verify Artifact
    #-------------------------------------------------------

    - name: Verify Downloaded Artifact
      shell: powershell
      run: |

        if (!(Test-Path "Website"))
        {
            throw "Website artifact was not downloaded."
        }

        Write-Host "===== WEBSITE ARTIFACT ====="
        Get-ChildItem Website -Recurse

    #-------------------------------------------------------
    # Stop IIS Website
    #-------------------------------------------------------

    - name: Stop IIS Website
      shell: powershell
      run: |

        Import-Module WebAdministration

        $site = Get-Website -Name "${env:WEBSITE_NAME}" -ErrorAction SilentlyContinue

        if ($null -eq $site)
        {
            throw "IIS Website '${env:WEBSITE_NAME}' does not exist."
        }

        if ($site.State -eq "Started")
        {
            Stop-WebSite -Name "${env:WEBSITE_NAME}"
            Write-Host "Website stopped successfully."
        }
        else
        {
            Write-Host "Website is already stopped."
        }

    #-------------------------------------------------------
    # Prepare IIS Folder
    #-------------------------------------------------------

    - name: Prepare IIS Folder
      shell: powershell
      run: |

        if (!(Test-Path "${env:WEBSITE_PATH}"))
        {
            New-Item `
                -ItemType Directory `
                -Path "${env:WEBSITE_PATH}" `
                -Force | Out-Null

            Write-Host "Created IIS Folder."
        }

        Remove-Item `
            "${env:WEBSITE_PATH}\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

        Write-Host "Old website files removed."

    #-------------------------------------------------------
    # Deploy Website
    #-------------------------------------------------------

    - name: Deploy Website Files
      shell: powershell
      run: |

        robocopy Website "${env:WEBSITE_PATH}" /MIR

        $exitCode = $LASTEXITCODE

        Write-Host ""
        Write-Host "======================================"
        Write-Host "Robocopy Exit Code : $exitCode"
        Write-Host "======================================"

        if ($exitCode -lt 8)
        {
            Write-Host "Deployment completed successfully."
            exit 0
        }
        else
        {
            throw "Robocopy failed with exit code $exitCode"
        }

    #-------------------------------------------------------
    # Start IIS Website
    #-------------------------------------------------------

    - name: Start IIS Website
      shell: powershell
      run: |

        Import-Module WebAdministration

        Start-WebSite -Name "${env:WEBSITE_NAME}"

        Write-Host "Website started successfully."

    #-------------------------------------------------------
    # Deployment Summary
    #-------------------------------------------------------

    - name: Show Deployment Summary
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "==========================================="
        Write-Host "Deployment Summary"
        Write-Host "==========================================="
        Write-Host "Website Name : ${env:WEBSITE_NAME}"
        Write-Host "Physical Path: ${env:WEBSITE_PATH}"
        Write-Host ""

        Get-ChildItem "${env:WEBSITE_PATH}" -Recurse

############################################################
# Stage 4 : Smoke Test
############################################################

  SmokeTest:
