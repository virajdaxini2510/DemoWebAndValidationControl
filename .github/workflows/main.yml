name: ASP.NET WebForms CI/CD

on:
  push:
    branches:
      - master
      - main

env:
  SOLUTION: DemoWebAndValidationControl.sln
  CONFIGURATION: Release

jobs:

##########################################################
# Stage 1 - Build
##########################################################

Build:

  runs-on: windows-latest

  steps:

  - uses: actions/checkout@v4

  - uses: microsoft/setup-msbuild@v2

  - uses: NuGet/setup-nuget@v2

  - name: Restore NuGet Packages
    run: nuget restore DemoWebAndValidationControl.sln

  - name: Build & Publish Website
    shell: powershell
    run: |

      msbuild DemoWebAndValidationControl.sln `
        /p:Configuration=Release `
        /p:DeployOnBuild=true `
        /p:WebPublishMethod=FileSystem `
        /p:DeleteExistingFiles=true `
        /p:publishUrl="${{ github.workspace }}\Published"

  - name: Show Published Files
    shell: powershell
    run: |
      Get-ChildItem "${{ github.workspace }}\Published" -Recurse

  - name: Upload Published Website
    uses: actions/upload-artifact@v4
    with:
      name: Website
      path: Published
##########################################################
# Stage 2 - Test Artifact
##########################################################

  Verify:

    needs: Build

    runs-on: windows-latest

    steps:

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: WebsitePackage
        path: Published

    - name: Verify Artifact Exists
      shell: powershell
      run: |
        Get-ChildItem Published -Recurse

##########################################################
# Stage 3 - Publish
##########################################################

  Publish:

    needs: Verify

    runs-on: windows-latest

    steps:

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: WebsitePackage
        path: Published

    - name: Publish Completed
      run: echo "Artifact Published Successfully"

##########################################################
# Stage 4 - Deploy
##########################################################

Deploy:

  needs: Publish

  runs-on: self-hosted

  env:
    WEBSITE_NAME: DemoWebAndValidationControl
    WEBSITE_PATH: C:\MyWebApp

  steps:

  - name: Download Website
    uses: actions/download-artifact@v4
    with:
      name: Website
      path: Website

  - name: Stop IIS Website
    shell: powershell
    run: |

      Import-Module WebAdministration

      if(Get-Website -Name "${env:WEBSITE_NAME}" -ErrorAction SilentlyContinue)
      {
          Stop-WebSite -Name "${env:WEBSITE_NAME}"
      }

  - name: Clean Website Folder
    shell: powershell
    run: |

      if(Test-Path "${env:WEBSITE_PATH}")
      {
          Remove-Item "${env:WEBSITE_PATH}\*" -Recurse -Force
      }

  - name: Copy Website Files
    shell: powershell
    run: |

      Copy-Item `
        "Website\*" `
        "${env:WEBSITE_PATH}" `
        -Recurse `
        -Force

  - name: Start IIS Website
    shell: powershell
    run: |

      Import-Module WebAdministration

      Start-WebSite -Name "${env:WEBSITE_NAME}"

  - name: Verify Deployment
    shell: powershell
    run: |

      Write-Host "Website deployed successfully."

      Get-ChildItem "${env:WEBSITE_PATH}"
