name: ASP.NET WebForms CI/CD

on:
  push:
    branches:
      - master
      - main

env:
  SOLUTION: DemoWebAndValidationControl.sln
  CONFIGURATION: Release

jobs:

##########################################################
# Stage 1 - Build
##########################################################

  Build:

    runs-on: windows-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore ${{ env.SOLUTION }}

    - name: Build Solution
      shell: powershell
      run: |
        msbuild "${{ env.SOLUTION }}" `
          /p:Configuration=${{ env.CONFIGURATION }} `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=Package `
          /p:PackageAsSingleFile=true `
          /p:SkipInvalidConfigurations=true `
          /p:PackageLocation="${{ github.workspace }}\Published"

    - name: Show Published Files
      shell: powershell
      run: |
        Get-ChildItem "${{ github.workspace }}\Published" -Recurse

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebsitePackage
        path: Published

##########################################################
# Stage 2 - Test Artifact
##########################################################

  Verify:

    needs: Build

    runs-on: windows-latest

    steps:

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: WebsitePackage
        path: Published

    - name: Verify Artifact Exists
      shell: powershell
      run: |
        Get-ChildItem Published -Recurse

##########################################################
# Stage 3 - Publish
##########################################################

  Publish:

    needs: Verify

    runs-on: windows-latest

    steps:

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: WebsitePackage
        path: Published

    - name: Publish Completed
      run: echo "Artifact Published Successfully"

##########################################################
# Stage 4 - Deploy
##########################################################

  Deploy:

    needs: Publish

    runs-on: self-hosted

    env:
      WEBSITE_NAME: DemoWebAndValidationControl
      WEBSITE_PATH: C:\inetpub\wwwroot\DemoWebAndValidationControl

    steps:

    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: WebsitePackage
        path: Published

    - name: Stop IIS Website
      shell: powershell
      run: |
        Import-Module WebAdministration

        if(Get-Website -Name "${env:WEBSITE_NAME}" -ErrorAction SilentlyContinue)
        {
            Stop-WebSite -Name "${env:WEBSITE_NAME}"
        }

    - name: Clean Website Folder
      shell: powershell
      run: |
        if(Test-Path "${env:WEBSITE_PATH}")
        {
            Remove-Item "${env:WEBSITE_PATH}\*" -Recurse -Force
        }
        else
        {
            New-Item -ItemType Directory -Path "${env:WEBSITE_PATH}"
        }

    - name: Extract Web Package
      shell: powershell
      run: |

        $zip = Get-ChildItem Published -Recurse -Filter *.zip | Select-Object -First 1

        Write-Host "Deploying package:"
        Write-Host $zip.FullName

        Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath "${env:WEBSITE_PATH}" `
            -Force

    - name: Start IIS Website
      shell: powershell
      run: |
        Import-Module WebAdministration

        Start-WebSite -Name "${env:WEBSITE_NAME}"

    - name: Deployment Completed
      run: echo "Application deployed successfully."
